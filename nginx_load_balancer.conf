# Configuración del upstream con múltiples instancias de la API
upstream api_backend {
    # Estrategia de balanceo: least_conn (menor número de conexiones)
    least_conn;
    
    # 3 instancias de la API (Docker Compose creará api_1, api_2, api_3)
    server exchange-api-1:3000 max_fails=3 fail_timeout=30s;
    server exchange-api-2:3000 max_fails=3 fail_timeout=30s;
    server exchange-api-3:3000 max_fails=3 fail_timeout=30s;
    
    # Configuración de health checks
    keepalive 32;
}

# Servidor principal
server {
    listen 80;
    server_name localhost;
    
    # Configuración de timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    
    # Headers para mantener información del cliente
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Endpoint principal - balanceo de carga
    location / {
        proxy_pass http://api_backend;
        
        # Configuración de reintentos
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
        
        # Buffer settings para mejor performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Health check endpoint para nginx
    location /nginx-health {
        access_log off;
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Health check del backend
    location /health {
        proxy_pass http://api_backend;
        access_log off;
    }
    
    # Archivos estáticos (si los hay)
    location /static/ {
        alias /static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
}
